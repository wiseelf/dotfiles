# tmux config. One session for each project, with Claude Code in it.

# Prefix: Ctrl+a. Claude Code uses Ctrl+b. macOS uses Ctrl+Space to change the input language.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -sg escape-time 10
set -g focus-events on
# When a session closes, go to another session. tmux exits only after the last one.
set -g detach-on-destroy off

# Terminal features for Claude Code: true color, Shift+Enter, notifications, clipboard.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB"
set -s extended-keys on
set -as terminal-features ",xterm*:extkeys"
set -g allow-passthrough on
set -s set-clipboard on

# Mouse selection: copy on release and keep the selection visible. A click removes it and exits copy mode.
bind -T copy-mode    MouseDragEnd1Pane send -X copy-pipe-no-clear
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-no-clear
bind -T copy-mode    MouseDown1Pane select-pane \; send -X clear-selection \; send -X cancel
bind -T copy-mode-vi MouseDown1Pane select-pane \; send -X clear-selection \; send -X cancel

# Terminal tab title: session name and the title of the active pane (Claude sets it to the topic).
set -g set-titles on
set -g set-titles-string "#S: #{pane_title}"

# Session picker with a live preview.
bind f display-popup -E -w 80% -h 70% "$HOME/.config/tmux/pick-session.sh"
# Previous / next session by name, the same order as the status bar. -r: press the arrow again without the prefix.
bind -r Left switch-client -p -O name
bind -r Right switch-client -n -O name
# Cmd+Shift+Left/Right in Ghostty send these keys.
bind ( switch-client -p -O name
bind ) switch-client -n -O name
bind r source-file "$HOME/.config/tmux/tmux.conf" \; display-message "tmux.conf reloaded"

# Theme: catppuccin/tmux, cloned by install.sh. It sets the colors and the window tabs.
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux
# Selection colors: the same as Ghostty. Catppuccin sets only the background and keeps the text color.
set -g mode-style "fg=#cdd6f4,bg=#353749"

# Status bar: all sessions on the left. ● = Claude asks for permission or asks a question (see claude-state.sh).
set -g status-interval 5
set -g status-left-length 200
set -g status-left "#{S/n:#{?#{==:#{session_name},#{client_session}},#[fg=#{@thm_blue} bold],#[fg=#{@thm_overlay_1}]}#{session_name}#{?#{==:#{@claude_state},waiting},#[fg=#{@thm_yellow}] ●,}#[default]  }"
set -g status-justify right
set -g status-right ""
