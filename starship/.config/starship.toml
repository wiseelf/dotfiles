palette = "catppuccin_mocha"
# Inserts a blank line between shell prompts
add_newline = false

# Which is equivalent to
format = """
$directory\
$git_branch\
$git_commit\
$git_state\
$git_metrics\
$git_status\
$aws\
$sudo\
$kubernetes\
$cmd_duration\
$line_break\
$status\
$container\
$character"""

right_format = ''

[gcloud]
disabled = true

[kubernetes]
disabled = false
format = 'on [$context( \($namespace\))]($style) '

[[kubernetes.contexts]]
context_pattern = ".*cluster/(.*prod.*)"
style = "bold red"
context_alias = "K8s: $1"

[[kubernetes.contexts]]
context_pattern = ".*cluster/(.*main.*)"
style = "bold yellow"
context_alias = "K8s: $1"

[[kubernetes.contexts]]
context_pattern = ".*cluster/(.*(dev|uat).*)"
style = "bold green"
context_alias = "K8s: $1"

[character]
success_symbol = "[>](bold green)"
error_symbol = "[x](bold red)"
vimcmd_symbol = "[<](bold green)"

[cmd_duration]
min_time = 5000
format = 'underwent [$duration](bold yellow)'

[git_status]
disabled = false
ahead = '⇡${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'
behind = '⇣${count}'
staged = '[++\($count\)](green)'

[directory]
read_only = " ro"
truncate_to_repo = true
truncation_symbol = ".../"
truncation_length = 15

[git_branch]
ignore_branches = ['master', 'main']

[status]
symbol = "[x](bold red) "

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
